<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MyCareerSprint App</title>
<meta name="description" content="Your personal career-management dashboard: resume tailoring, LinkedIn optimization, interview practice, and a daily CareerSprint plan.">
<meta name="theme-color" content="#161852">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CareerSprint">
<style>
/* =========================================================
   MyCareerSprint — Shared Design Tokens & Base Components
   Sourced from the brand logo: navy #161852, blue #3F52F7,
   gold #EDA837, neutral gray for supporting text.
   ========================================================= */
:root{
  /* Color */
  --navy-900:#12143f;
  --navy:#161852;
  --navy-700:#232a6b;
  --blue:#3f52f7;
  --blue-600:#2f3fd1;
  --blue-100:#e7eafe;
  --gold:#eda837;
  --gold-600:#c98618;
  --gold-100:#fdf1dc;
  --surface:#ffffff;
  --surface-alt:#f6f7fc;
  --surface-dark:#0f1140;
  --border:#e3e5f1;
  --text:#1b1d2b;
  --text-muted:#5b6172;
  --text-on-dark:#f4f5fb;
  --text-on-dark-muted:#aeb2d6;
  --success:#1c9b6b;
  --warning:#c98618;
  --danger:#d64545;
  --info:#3f52f7;

  /* Spacing scale */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px;
  --sp-8:32px; --sp-12:48px; --sp-16:64px; --sp-24:96px;

  /* Radius */
  --r-tight:8px; --r-standard:12px; --r-round:999px;

  /* Type */
  --font-sans:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;

  /* Shadow */
  --shadow-sm:0 1px 2px rgba(18,20,63,.06),0 1px 1px rgba(18,20,63,.04);
  --shadow-md:0 8px 24px rgba(18,20,63,.10);
  --shadow-lg:0 20px 50px rgba(18,20,63,.16);

  --maxw:1200px;
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--text);
  background:var(--surface);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{
  font-family:var(--font-sans);
  color:var(--navy);
  margin:0 0 var(--sp-4);
  line-height:1.15;
  letter-spacing:-0.02em;
}
.display{font-size:56px;font-weight:700;letter-spacing:-.03em;}
h1{font-size:40px;font-weight:700;}
h2{font-size:32px;font-weight:700;}
h3{font-size:24px;font-weight:600;}
h4{font-size:20px;font-weight:600;}
p{margin:0 0 var(--sp-4);}
.body-lg{font-size:18px;}
.small{font-size:14px;}
.caption{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--text-muted);}
.muted{color:var(--text-muted);}
a{color:var(--blue);text-decoration:none;}
a:hover{text-decoration:underline;}
img{max-width:100%;display:block;}
ul{padding-left:1.2em;}
.container{max-width:var(--maxw);margin:0 auto;padding:0 var(--sp-6);}
@media (max-width:640px){
  .display{font-size:36px;} h1{font-size:30px;} h2{font-size:26px;}
  .container{padding:0 var(--sp-4);}
}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-sans);font-weight:600;font-size:15px;
  padding:13px 24px;border-radius:var(--r-standard);border:2px solid transparent;
  cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
  min-height:44px;line-height:1;white-space:nowrap;
}
.btn:hover{text-decoration:none;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--blue);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--blue-600);box-shadow:var(--shadow-md);color:#fff;}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-gold:hover{background:var(--gold-600);color:#fff;}
.btn-secondary{background:transparent;border-color:var(--navy);color:var(--navy);}
.btn-secondary:hover{background:var(--navy);color:#fff;}
.btn-ghost{background:transparent;color:var(--navy);border-color:transparent;padding:13px 16px;}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-on-dark{background:#fff;color:var(--navy);}
.btn-on-dark:hover{background:var(--gold);color:var(--navy);}
.btn-block{width:100%;}
.btn-sm{padding:9px 16px;font-size:13px;min-height:36px;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* Badge / pill */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 12px;border-radius:var(--r-round);background:var(--blue-100);color:var(--blue-600);}
.badge-gold{background:var(--gold-100);color:var(--gold-600);}
.badge-outline{background:transparent;border:1px solid var(--border);color:var(--text-muted);}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-standard);padding:var(--sp-6);box-shadow:var(--shadow-sm);}
.card:hover{box-shadow:var(--shadow-md);}
.card-link{transition:box-shadow .15s ease, transform .15s ease;display:block;color:inherit;}
.card-link:hover{text-decoration:none;transform:translateY(-2px);}

/* Section rhythm */
.section{padding:var(--sp-24) 0;}
.section-sm{padding:var(--sp-16) 0;}
.section-alt{background:var(--surface-alt);}
.section-dark{background:var(--navy);color:var(--text-on-dark);}
.section-dark h1,.section-dark h2,.section-dark h3,.section-dark h4{color:#fff;}
.section-dark p{color:var(--text-on-dark-muted);}
@media (max-width:640px){ .section{padding:var(--sp-12) 0;} .section-sm{padding:var(--sp-8) 0;} }

/* Grid helpers */
.grid{display:grid;gap:var(--sp-6);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;} .gap-6{gap:24px;}
.text-center{text-align:center;}

/* ---------- Site header / nav ---------- */
.site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.98);border-bottom:1px solid var(--border);}
.site-header .container{display:flex;align-items:center;justify-content:space-between;height:76px;gap:var(--sp-6);}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand img{height:38px;width:auto;}
.nav-links{display:flex;align-items:center;gap:var(--sp-6);flex:1;justify-content:center;}
.nav-links a{color:var(--text);font-weight:600;font-size:15px;}
.nav-links a:hover{color:var(--blue);text-decoration:none;}
.nav-links a.active{color:var(--blue);}
.header-cta{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.nav-toggle{display:none;background:none;border:none;cursor:pointer;padding:8px;}
.nav-toggle span{display:block;width:24px;height:2px;background:var(--navy);margin:5px 0;border-radius:2px;}
@media (max-width:980px){
  .nav-links{position:fixed;top:76px;left:0;right:0;bottom:0;background:#fff;flex-direction:column;justify-content:flex-start;padding:var(--sp-8) var(--sp-6);gap:var(--sp-4);transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;}
  .nav-links.open{transform:translateX(0);}
  .nav-links a{font-size:20px;width:100%;padding:10px 0;border-bottom:1px solid var(--border);}
  .nav-toggle{display:block;}
  .header-cta .btn-secondary{display:none;}
}

/* ---------- Footer ---------- */
.site-footer{background:var(--navy);color:var(--text-on-dark-muted);padding:var(--sp-16) 0 var(--sp-8);}
.site-footer a{color:var(--text-on-dark-muted);}
.site-footer a:hover{color:#fff;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:var(--sp-8);margin-bottom:var(--sp-12);}
.footer-grid h4{color:#fff;font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--sp-4);}
.footer-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:14px;}
.footer-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:var(--sp-6);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px;}
.footer-brand p{max-width:280px;font-size:14px;}
.social-row{display:flex;gap:12px;}
.social-row a{width:36px;height:36px;border-radius:var(--r-round);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;}
@media (max-width:900px){.footer-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:640px){.footer-grid{grid-template-columns:1fr;}}

/* Skip link for a11y */
.skip-link{position:absolute;left:-999px;top:0;background:var(--navy);color:#fff;padding:10px 16px;z-index:100;border-radius:0 0 8px 0;}
.skip-link:focus{left:0;}

/* Form basics */
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--navy);}
input,textarea,select{
  width:100%;font-family:var(--font-body);font-size:16px;padding:12px 14px;border-radius:var(--r-tight);
  border:1.5px solid var(--border);background:#fff;color:var(--text);
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100);}
.field{margin-bottom:var(--sp-4);}

/* Focus visibility */
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* App-shell specific styles, layered on top of shared/tokens.css */
html,body{height:100%;background:var(--surface-alt);}
#appRoot{display:flex;height:100vh;overflow:hidden;}

/* ---- Sidebar ---- */
.app-sidebar{
  width:264px;flex-shrink:0;background:var(--navy);color:#fff;
  display:flex;flex-direction:column;height:100%;
}
.app-sidebar .brand-row{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;}
.app-sidebar .brand-row .logo-chip{background:#fff;display:inline-flex;padding:7px 12px;border-radius:10px;}
.app-sidebar .brand-row img{height:26px;display:block;}
.app-nav{flex:1;overflow-y:auto;padding:8px 12px;}
.app-nav a{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;
  color:var(--text-on-dark-muted);font-weight:600;font-size:14.5px;margin-bottom:2px;
}
.app-nav a:hover{background:rgba(255,255,255,.06);color:#fff;text-decoration:none;}
.app-nav a.active{background:rgba(255,255,255,.12);color:#fff;}
.app-nav .icon{width:20px;text-align:center;flex-shrink:0;}
.app-nav .nav-group-label{padding:16px 12px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-on-dark-muted);opacity:.7;}
.sidebar-footer{padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,.1);}
.sidebar-footer .user-row{display:flex;align-items:center;gap:10px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.plan-pill{font-size:11px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}

/* ---- Topbar + main ---- */
.app-main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0;}
.app-topbar{
  height:64px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px;
}
.app-topbar h1{font-size:20px;margin:0;}
.mobile-menu-btn{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--navy);}
.app-view{flex:1;overflow-y:auto;padding:28px;}
.app-view-inner{max-width:1080px;margin:0 auto;}
.install-btn{display:none;}
.install-btn.show{display:inline-flex;}

/* Sidebar mobile behavior */
.sidebar-backdrop{display:none;}
@media (max-width:900px){
  .app-sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .25s ease;}
  .app-sidebar.open{transform:translateX(0);}
  .mobile-menu-btn{display:block;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,12,40,.5);z-index:55;}
  .sidebar-backdrop.show{display:block;}
  .app-view{padding:18px;}
}

/* ---- In-app help banner ---- */
.help-banner{
  display:flex;align-items:flex-start;gap:14px;
  background:var(--blue-100);border:1px solid #d3d9fc;border-left:4px solid var(--blue);
  border-radius:10px;padding:16px 18px;margin-bottom:20px;position:relative;
}
.help-icon{font-size:22px;line-height:1;flex-shrink:0;margin-top:1px;}
.help-text{flex:1;min-width:0;}
.help-title{margin:0 0 4px;font-weight:700;font-size:14.5px;color:var(--navy);}
.help-body{margin:0;font-size:13.5px;color:var(--text-muted);line-height:1.5;}
.help-dismiss{
  background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;
  padding:4px 6px;flex-shrink:0;border-radius:6px;
}
.help-dismiss:hover{background:rgba(63,82,247,.12);color:var(--blue-600);}

/* ---- Stat cards ---- */
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.stat-card .value{font-size:26px;font-weight:700;color:var(--navy);}
.stat-card .label{font-size:13px;color:var(--text-muted);}

/* ---- Task list / checklist ---- */
.task-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:10px;}
.task-row.done{opacity:.55;}
.task-row.done .task-title{text-decoration:line-through;}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;background:#fff;}
.task-check.checked{background:var(--success);border-color:var(--success);color:#fff;}
.task-title{font-weight:600;font-size:14.5px;flex:1;}
.task-meta{font-size:12px;color:var(--text-muted);}

/* ---- Chat (AI Career Coach) ---- */
.chat-window{display:flex;flex-direction:column;gap:14px;height:calc(100vh - 320px);min-height:320px;overflow-y:auto;padding:8px 4px;}
.msg{max-width:72%;padding:12px 16px;border-radius:14px;font-size:14.5px;line-height:1.5;}
.msg.bot{background:#fff;border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.chat-input-row{display:flex;gap:10px;margin-top:14px;}
.suggestion-chip{display:inline-block;padding:8px 14px;border:1px solid var(--border);border-radius:999px;font-size:13px;margin:4px 6px 0 0;cursor:pointer;background:#fff;}
.suggestion-chip:hover{border-color:var(--blue);color:var(--blue);}

/* ---- Table (Application Tracker) ---- */
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:12px;}
table.tracker{width:100%;border-collapse:collapse;font-size:14px;min-width:720px;}
table.tracker th{text-align:left;padding:12px 16px;background:var(--surface-alt);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);border-bottom:1px solid var(--border);}
table.tracker td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.tracker tr:last-child td{border-bottom:none;}
.stage-pill{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.stage-Saved{background:#eef0fa;color:#5b6172;}
.stage-Applied{background:var(--blue-100);color:var(--blue-600);}
.stage-Interviewing{background:var(--gold-100);color:var(--gold-600);}
.stage-Offer{background:#e2f7ee;color:var(--success);}
.stage-Rejected{background:#fbe7e7;color:var(--danger);}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:15px;padding:4px 6px;}
.icon-btn:hover{color:var(--danger);}

/* ---- Interview practice ---- */
.question-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:32px;text-align:center;}
.timer-display{font-size:40px;font-weight:700;color:var(--navy);font-family:var(--font-sans);}

/* ---- Score gauge ---- */
.gauge-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.gauge{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:conic-gradient(var(--blue) calc(var(--pct)*1%), var(--border) 0);}
.gauge-inner{width:110px;height:110px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge-inner .num{font-size:28px;font-weight:700;color:var(--navy);}
.gauge-inner .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;}

/* ---- Roadmap timeline ---- */
.roadmap-line{position:relative;padding-left:36px;}
.roadmap-line::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--border);}
.milestone{position:relative;margin-bottom:28px;}
.milestone::before{content:"";position:absolute;left:-36px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--border);}
.milestone.done::before{background:var(--success);border-color:var(--success);}
.milestone.current::before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-100);}

/* ---- Onboarding / Login ---- */
.auth-shell{min-height:100vh;display:none;align-items:center;justify-content:center;background:var(--surface-alt);padding:24px;}
.auth-shell.active{display:flex;}
.auth-card{width:100%;max-width:460px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);padding:36px;}
.wizard-progress{display:flex;gap:6px;margin-bottom:24px;}
.wizard-progress .dot{height:6px;flex:1;border-radius:4px;background:var(--border);}
.wizard-progress .dot.active{background:var(--blue);}
.option-tile{display:block;border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-weight:600;font-size:14.5px;}
.option-tile input{display:none;}
.option-tile.selected{border-color:var(--blue);background:var(--blue-100);color:var(--blue-600);}

/* ---- Toast ---- */
#toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:14px 20px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transform:translateY(10px);transition:all .25s ease;pointer-events:none;font-size:14px;}
#toast.show{opacity:1;transform:translateY(0);}

/* ---- Modal ---- */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,12,40,.55);display:none;align-items:center;justify-content:center;z-index:150;padding:20px;}
.modal-backdrop.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:28px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);}

[data-view]{display:none;}
[data-view].active{display:block;}

</style>
</head>
<body>
  <div id="authContainer" class="auth-shell"></div>
  <div id="appShell" style="display:none;"></div>

/* ---------------- Functional helpers ---------------- */
const STOPWORDS = new Set("a,an,the,and,or,but,to,of,in,on,for,with,as,is,are,be,will,you,your,we,our,this,that,at,by,from,it,have,has,who,will,strong,ability,experience,years,role,team".split(","));

function keywordsFrom(text) {
  return [...new Set((text.toLowerCase().match(/[a-z][a-z\-]{2,}/g) || []).filter(w => !STOPWORDS.has(w)))];
}
function computeMatch(jobText, resumeText) {
  const jdWords = keywordsFrom(jobText);
  const resumeWords = new Set(keywordsFrom(resumeText));
  if (!jdWords.length) return { pct: 0, matched: [], missing: [] };
  const matched = jdWords.filter(w => resumeWords.has(w));
  const missing = jdWords.filter(w => !resumeWords.has(w)).slice(0, 10);
  const pct = Math.round((matched.length / jdWords.length) * 100);
  return { pct, matched: matched.slice(0, 12), missing };
}

const OPENERS = {
  Professional: (role, company) => `I am writing to express my interest in the ${role} position at ${company}.`,
  Warm: (role, company) => `I'll admit it — when I saw the ${role} opening at ${company}, I stopped scrolling.`,
  Confident: (role, company) => `I'm the ${role} ${company} is looking for, and here's the short version of why.`,
};
function buildCoverLetter({ company, role, manager, strengths, tone }) {
  const opener = (OPENERS[tone] || OPENERS.Professional)(role, company);
  const greeting = manager ? `Dear ${manager},` : "Dear Hiring Team,";
  const strengthLines = strengths ? strengths.split(/\n|,/).map(s => s.trim()).filter(Boolean).slice(0, 4) : [];
  const body = strengthLines.length
    ? `In my recent work, I ${strengthLines.map(s => s.charAt(0).toLowerCase() + s.slice(1)).join("; I ")}. I'd bring that same focus to the ${role} team at ${company}.`
    : `My background lines up closely with what this role needs, and I'm ready to bring that impact to ${company} from day one.`;
  return `${greeting}\n\n${opener} ${body}\n\nI'd welcome the chance to talk about how I can contribute to ${company}'s goals. Thank you for your time and consideration.\n\nBest regards,\n${state.user.name || "[Your Name]"}`;
}

function analyzeLinkedIn(headline, about, role) {
  const feedback = [];
  let score = 40;
  if (headline && headline.length > 15) { score += 15; } else { feedback.push("Headline is too short — add your specialty and the value you deliver."); }
  if (headline && /\d/.test(headline)) { score += 10; feedback.push("Nice — your headline includes a number, which stands out."); } else { feedback.push("Consider adding a number or outcome to your headline."); }
  if (about && about.length > 200) { score += 15; } else { feedback.push("Your About section is short — aim for 3-4 short paragraphs."); }
  if (about && /(seeking|looking for)/i.test(about)) { feedback.push('Drop "seeking opportunities" language — lead with what you deliver instead.'); } else { score += 10; }
  score = Math.min(98, score);
  const headlineSuggestion = role
    ? `${role} | Turning ${strengthWord(about)} into measurable results | Open to new opportunities`
    : `Results-driven professional | Turning ${strengthWord(about)} into measurable outcomes`;
  return { score, feedback, headline: headlineSuggestion };
}
function strengthWord(about) {
  const words = keywordsFrom(about || "");
  return words[0] || "strategy";
}

function sendChat(text) {
  const input = document.getElementById("chatInput");
  const message = (text || (input ? input.value.trim() : ""));
  if (!message) return;
  state.chatMessages.push({ from: "me", text: message });
  if (input) input.value = "";
  renderAppShell("coach");
  setTimeout(() => {
    state.chatMessages.push({ from: "bot", text: coachReply(message) });
    renderAppShell("coach");
  }, 500);
}
function coachReply(message) {
  const m = message.toLowerCase();
  if (m.includes("interview")) return "Let's use Interview Practice — pick a category (Behavioral, Technical, Situational, or Salary Negotiation) and I'll cycle through real questions with a framework for each.";
  if (m.includes("linkedin")) return "Head to the LinkedIn Optimizer and paste your current headline and About section — I'll score them and draft an improved headline in seconds.";
  if (m.includes("resume") || m.includes("cover letter")) return "Try Resume-to-Job Match: paste the job post and I'll show exactly which keywords are missing, then you can generate a tailored cover letter in one click.";
  if (m.includes("laid off") || m.includes("layoff")) return "First: breathe. Check severance and COBRA deadlines this week, then let's set your target role so I can build your first CareerSprint plan. Want me to open the Layoff Recovery guide?";
  if (m.includes("today") || m.includes("start")) return "Open Today's CareerSprint — I've queued 3 short, high-leverage actions based on where you are in your roadmap.";
  return "Got it — I've noted that. For now, your fastest wins are usually in Today's CareerSprint or the Resume-to-Job Match tool. Want me to open one of those?";
}

    const topBtn = document.getElementById("topInstallBtn");
    if (topBtn) topBtn.classList.add("show");
    const obBtn = document.getElementById("obInstallBtn");
    if (obBtn) obBtn.style.display = "block";
  });
  window.addEventListener("appinstalled", () => showToast("MyCareerSprint installed! Find it on your home screen."));
}
function triggerInstall() {
  if (window.deferredInstallPrompt) {
    window.deferredInstallPrompt.prompt();
    window.deferredInstallPrompt.userChoice.finally(() => { window.deferredInstallPrompt = null; });
  } else {
    showToast("To install: use your browser's “Add to Home Screen” option (Safari share menu, or Chrome menu ⋮).");
  }
}
function registerServiceWorker() {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(() => {/* fine in prototype/preview contexts without a server */});
  }
}

  </script>
